{{- if .Values.envSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "serpentseek.envSecretName" . }}
  labels:
    {{- include "serpentseek.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.envSecrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
