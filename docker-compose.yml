services:
  serpentseek:
    build:
      context: .
      # App version/commit/date baked into the binary. `make up` fills these; a
      # plain `docker compose up --build` falls back to the 1.1.2 default.
      args:
        TAG: ${APP_VERSION:-1.1.2}
        COMMIT: ${APP_COMMIT:-dev}
        BUILD_DATE: ${APP_BUILD_DATE:-unknown}
    container_name: serpentseek
    ports: ["8080:8080"]
    env_file: [.env]
    volumes: [serpentseek_data:/app/data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    # Hardening: immutable root filesystem (the data volume stays writable),
    # bounded memory/CPU and rotated container logs.
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Start only after PostgreSQL is healthy when the extdb profile is active;
    # optional so the default SQLite stack does not depend on it.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks: [backend]

  postgres:
    # Compose profile "extdb" (optional external storage).
    # PostgreSQL License — a separate satellite container, NOT a code dependency.
    image: postgres:17-alpine
    profiles: ["extdb"]
    container_name: serpentseek-postgres
    environment:
      POSTGRES_DB: serpentseek
      POSTGRES_USER: serpent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [serpentseek_pg:/var/lib/postgresql/data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serpent -d serpentseek"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [backend]

# SearXNG is NOT part of this stack: SerpentSeek connects to an externally
# hosted SearXNG instance. Set its URL via SEARXNG_URL or the Providers UI.
# See deploy/searxng/settings.yml for an example instance configuration.

networks:
  backend: {}

volumes:
  serpentseek_data: {}
  serpentseek_pg: {}
