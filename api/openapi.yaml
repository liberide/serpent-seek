openapi: 3.1.0
info:
  title: SerpentSeek API
  version: "1.1.1"
  summary: Search gateway microservice — visual provider chains, per-token chain binding and per-endpoint developer tokens, live request tracing, API-key/Passkeys auth, SQLite/PostgreSQL storage.
  description: |
    SerpentSeek is a drop-in replacement for the serpent-shim used by Open WebUI, upgraded to a full
    service with an admin SPA.

    **Machine endpoint.** `POST /search` is Open WebUI-compatible: request `{query, count}`, response is always
    HTTP 200 with an array of `[{link,title,snippet}]` (or `[]` on failure/empty). Diagnostics are carried via
    response headers `X-Serpent-Rid` and `X-Serpent-Api` and the History UI.

    **Auth.** Two mechanisms, either or both can be used:
    - `bearerAuth`: API keys (`seek_ak_…` scope `search`; `seek_admin_…` scope `admin`; `read` for GET-only).
      When `DEVELOPER_MODE=true`, admins can also mint dedicated developer tokens (`seek_dev_…`) with full
      admin scope for third-party integrations (see `/api/developer`); they are rejected as soon as the
      setting is turned off.
    - `cookieAuth`: session cookie `seek_sid` + CSRF double-submit header `X-CSRF-Token` on all mutations.
    When `AUTH_ENABLED=false` every `/api/*` endpoint behaves as open-admin and `/search` needs no key.

    **Request tracing.** Every response carries `X-Serpent-Rid`. Live step-by-step execution of a request's
    chain is exposed over SSE (see `/api/requests/{id}/events`).

    **Chains & tokens.** Each API key can be bound to a specific chain (`chain_id`), independent of the active
    one; unbound keys use the default (= active) chain. `GET /api/chains` reports `bound_keys` and
    `active_bound_keys`; a bound but missing chain fails closed. Deleting a non-active chain unbinds its keys
    (they fall back to the default) and returns `unbound_keys`; the active chain cannot be deleted.

    **Errors.** All `4xx/5xx` responses: `{ "error": { "code", "message", "rid" } }`.
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://localhost:8080
    description: Local default (docker compose up --build)

tags:
  - name: machine
    description: Open WebUI-compatible machine search endpoint
  - name: mcp
    description: Model Context Protocol (MCP) search tool over streamable HTTP
  - name: meta
    description: Health and version
  - name: auth
    description: Sessions, login/logout, first-run setup, passkeys
  - name: users
    description: Users, API keys, passkey credentials management
  - name: history
    description: Search request history + live SSE tracing
  - name: chains
    description: Visual provider chains (graph of nodes/edges)
  - name: providers
    description: Search provider configuration and live tests
  - name: settings
    description: Runtime settings (env overrides marked readonly)
  - name: logs
    description: In-app log browsing
  - name: audit
    description: Administrative audit trail
  - name: maintenance
    description: Cleanup jobs and manual maintenance actions
  - name: stats
    description: Dashboard aggregates
  - name: playground
    description: UI-originated manual search with live trace

security:
  - bearerAuth: []
  - cookieAuth: []
    csrfHeader: []

paths:
  # ---------------- machine / meta ----------------
  /healthz:
    get:
      tags: [meta]
      summary: Liveness/readiness probe (503 until migrations are applied)
      security: []
      responses:
        "200":
          description: Service is ready
          headers: { X-Serpent-Rid: { $ref: "#/components/headers/XSerpentRid" } }
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean } }
              example: { ok: true }
        "503":
          description: Not ready (migrations running, DB not reachable)
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean }, reason: { type: string } }
              example: { ok: false, reason: migrations_running }

  /livez:
    get:
      tags: [meta]
      summary: Liveness probe (always 200 while the process is up)
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
              example: { ok: true }

  /readyz:
    get:
      tags: [meta]
      summary: Readiness probe (503 while the database is unreachable)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean }, error: { type: string } }

  /version:
    get:
      tags: [meta]
      summary: Version string (plain text, one line)
      security: []
      responses:
        "200":
          description: The running version (commit/build details are in `/api/info`)
          content:
            text/plain:
              schema: { type: string }
              example: 1.1.0

  /openapi.yaml:
    get:
      tags: [meta]
      summary: The OpenAPI 3.1 specification for this API (this document)
      description: Public and CORS-enabled so external tools and client generators can import it by URL. The canonical source is github.com/liberide/serpent-seek (api/openapi.yaml).
      security: []
      responses:
        "200":
          description: Raw OpenAPI document
          content:
            application/yaml:
              schema: { type: string }

  /metrics:
    get:
      tags: [meta]
      summary: Prometheus metrics (text exposition format 0.0.4)
      description: Aggregate counters/gauges only (search outcomes, provider attempts, durations, SSE clients, build info). No query text or secrets.
      security: []
      responses:
        "200":
          description: Metrics
          content:
            text/plain:
              schema: { type: string }

  /search:
    post:
      tags: [machine]
      summary: Drop-in search endpoint for Open WebUI (replaces serpent-shim)
      description: |
        Compatible with the serpent-shim contract: Bearer auth, `{query, count}`, HTTP 200 **always** —
        either `Row[]` (≤ count) or `[]` on failure/empty. Who answered and the request id are returned in
        headers; full diagnostics live in History (`/api/requests/{id}`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1, description: Search text }
                count:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
                  description: Max rows to return
            example: { query: "open webui searxng json", count: 5 }
      responses:
        "200":
          description: Search rows (empty array means fail/empty — see History and response headers)
          headers:
            X-Serpent-Rid: { $ref: "#/components/headers/XSerpentRid" }
            X-Serpent-Api: { $ref: "#/components/headers/XSerpentApi" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Row" }
              example:
                - link: "https://searxng.org/"
                  title: "SearXNG"
                  snippet: "Privacy-respecting metasearch engine."
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------- mcp ----------------
  /mcp:
    get:
      tags: [mcp]
      summary: Open an MCP SSE stream (Streamable HTTP transport)
      description: |
        Model Context Protocol endpoint exposing a single `search` tool. GET opens an SSE stream and returns
        the session id in the `Mcp-Session-Id` header; POST sends JSON-RPC 2.0 requests; DELETE closes the
        session. POST without a session id also works as a plain JSON-RPC request/response endpoint.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 'SSE stream of `event: message` frames carrying JSON-RPC responses'
          headers:
            Mcp-Session-Id: { schema: { type: string } }
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [mcp]
      summary: Send a JSON-RPC 2.0 message (`initialize`, `ping`, `tools/list`, `tools/call`)
      security:
        - bearerAuth: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: false
          schema: { type: string }
          description: When present, the response is delivered over the matching SSE stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ["2.0"] }
                id: { description: Request id; omit for a notification }
                method: { type: string }
                params: {}
            example: { jsonrpc: "2.0", id: 1, method: "tools/call", params: { name: search, arguments: { query: "hello", count: 3 } } }
      responses:
        "200":
          description: JSON-RPC response (no session id) or an acknowledgement when a session id is used
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc: { type: string }
                  id: {}
                  result: {}
                  error:
                    type: object
                    properties:
                      code: { type: integer }
                      message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [mcp]
      summary: Close an MCP session
      security:
        - bearerAuth: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session closed }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------- auth ----------------
  /api/me:
    get:
      tags: [auth]
      summary: Current session/user state
      responses:
        "200":
          description: Auth mode + current user (null user with auth_enabled=false means open-admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }

  /api/setup/status:
    get:
      tags: [auth]
      summary: First-run / auth-mode status (public)
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                properties:
                  needs_setup: { type: boolean }
                  auth_enabled: { type: boolean }
                  auth_off_notice_hidden: { type: boolean }
                  passkeys_enabled: { type: boolean }
                  rp_id: { type: string }

  /api/auth/setup:
    post:
      tags: [auth]
      summary: First-run setup (creates first admin + first API key)
      description: Available only while no admin exists; requires the one-time `SETUP_TOKEN` printed to server logs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name]
              properties:
                token: { type: string, description: One-time SETUP_TOKEN printed to the server logs }
                name: { type: string, description: Name of the first administrator }
      responses:
        "201":
          description: Admin created; API key secret is shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  api_key: { type: string, description: Plaintext admin key, shown only once }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410":
          description: Setup window closed (token expired or setup already done)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Login with an API key (creates a session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties: { api_key: { type: string, example: "seek_ak_ab12cd34.…" } }
      responses:
        "200":
          description: Session established; `seek_sid` (HttpOnly) + `seek_csrf` cookies set
          headers: { X-Serpent-Rid: { $ref: "#/components/headers/XSerpentRid" } }
          content:
            application/json:
              schema:
                type: object
                properties: { user: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Logout (invalidates current session)
      responses:
        "204": { description: Logged out, cookies cleared }

  /api/auth/passkey/register/begin:
    post:
      tags: [auth]
      summary: WebAuthn registration — begin (requires an authenticated session)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string, description: Friendly name for the passkey } }
      responses:
        "200":
          description: PublicKeyCredentialCreationOptions (webauthn protocol object)
          content:
            application/json:
              schema: { type: object, description: navigator.credentials.create() options }

  /api/auth/passkey/register/finish:
    post:
      tags: [auth]
      summary: WebAuthn registration — finish (stores the credential)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Attestation response from the authenticator }
      responses:
        "201":
          description: Credential stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCredential" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/auth/passkey/assert/begin:
    post:
      tags: [auth]
      summary: WebAuthn login — begin (discoverable credentials)
      security: []
      responses:
        "200":
          description: PublicKeyCredentialRequestOptions
          content:
            application/json:
              schema: { type: object, description: navigator.credentials.get() options }

  /api/auth/passkey/assert/finish:
    post:
      tags: [auth]
      summary: WebAuthn login — finish (creates session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Assertion response from the authenticator }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                type: object
                properties: { user: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------- users / keys / passkeys ----------------
  /api/users:
    get:
      tags: [users]
      summary: List users (admin)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      tags: [users]
      summary: Create user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/users/{id}:
    patch:
      tags: [users]
      summary: Update user (rename, role, disable)
      parameters: [ { $ref: "#/components/parameters/UserId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      summary: Delete user (admin); own admin account cannot delete itself while it is the last admin
      parameters: [ { $ref: "#/components/parameters/UserId" } ]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/users/{id}/quota:
    get:
      tags: [users]
      summary: Read a user's search quota including current usage (admin)
      description: >
        Returns the quota status. A user without a quota row reports
        requests = 0 (unlimited); the per-user quota is enforced on every
        search endpoint for that user's API keys and sessions.
      parameters: [ { $ref: "#/components/parameters/UserId" } ]
      responses:
        "200":
          description: Quota status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserQuotaStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [users]
      summary: Set a user's search quota (admin)
      description: >
        Upserts the per-user allowance. Omitted fields keep their current
        value; requests = 0 means unlimited. Changes apply to the next request.
      parameters: [ { $ref: "#/components/parameters/UserId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserQuotaInput" }
      responses:
        "200":
          description: Updated quota status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserQuotaStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      summary: Remove a user's search quota (admin) — the user becomes unlimited
      parameters: [ { $ref: "#/components/parameters/UserId" } ]
      responses:
        "200":
          description: Quota removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/keys:
    get:
      tags: [users]
      summary: List API keys (prefix only — secrets are never returned)
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
    post:
      tags: [users]
      summary: Create API key (secret returned ONCE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreateInput" }
      responses:
        "201":
          description: Created — copy the secret now, it is never shown again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }

  /api/keys/bulk:
    post:
      tags: [users]
      summary: Bulk revoke or delete API keys (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkInput" }
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/keys/{id}:
    patch:
      tags: [users]
      summary: Update key (rename, chain binding, expiry, revoke)
      parameters: [ { $ref: "#/components/parameters/KeyId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                chain_id: { type: string, nullable: true, description: Bind the token to a chain; empty string clears the binding (active chain) }
                expires_at: { type: string, format: date-time, nullable: true }
                revoke: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400": { description: Unknown chain_id }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      summary: Delete key permanently
      parameters: [ { $ref: "#/components/parameters/KeyId" } ]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/{id}/passkeys:
    get:
      tags: [users]
      summary: List a user's passkey credentials
      parameters: [ { $ref: "#/components/parameters/UserId" } ]
      responses:
        "200":
          description: Passkeys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PasskeyCredential" }

  /api/passkeys/{id}:
    delete:
      tags: [users]
      summary: Delete a passkey credential
      parameters: [ { $ref: "#/components/parameters/UserId" } ]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- developer mode ----------------
  /api/developer:
    get:
      tags: [users]
      summary: Developer-mode state and developer tokens (admin)
      responses:
        "200":
          description: Developer mode status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeveloperStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/developer/mode:
    put:
      tags: [users]
      summary: Enable or disable developer mode (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated developer-mode status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeveloperStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/developer/endpoints:
    get:
      tags: [users]
      summary: List grantable endpoint ids for developer-token permissions (admin)
      responses:
        "200":
          description: Non-public API operations, usable as permission ids
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeveloperEndpoint" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/developer/tokens:
    post:
      tags: [users]
      summary: Create a developer token (admin; requires developer mode)
      description: >
        Returns the plaintext token exactly once. Developer tokens use the `seek_dev_…` prefix and carry
        `admin,search,read` scope; they are only accepted while developer mode is active. When `permissions`
        is omitted the token may call every endpoint; pass a (possibly empty) list of ids from
        `/api/developer/endpoints` to restrict it (or `["*"]` for explicit full access).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: Human-readable label; defaults to "developer token" }
                permissions:
                  type: array
                  description: Endpoint ids to grant; omit for full access, `[]` to deny everything.
                  items: { type: string, example: "GET /api/chains" }
      responses:
        "201":
          description: Created — copy the token now, it is never shown again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeveloperTokenCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/developer/tokens/{id}:
    patch:
      tags: [users]
      summary: Edit a developer token's name and/or endpoint permissions (admin)
      parameters: [ { $ref: "#/components/parameters/KeyId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeveloperTokenPatch" }
      responses:
        "200":
          description: Updated developer token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeveloperToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      summary: Revoke a developer token, or delete it permanently with ?purge=true (admin)
      parameters:
        - { $ref: "#/components/parameters/KeyId" }
        - name: purge
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true the token row is deleted permanently instead of being revoked.
      responses:
        "200":
          description: "Revoked (default) or deleted (`deleted: true`)"
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  deleted: { type: boolean, description: Present and true when the token was permanently deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- history ----------------
  /api/requests:
    get:
      tags: [history]
      summary: Search request history (cursor pagination, filters)
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RequestStatus" }
        - name: provider
          in: query
          schema: { type: string, description: Filter by step provider code }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          schema: { type: string, description: Substring match on query text }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of requests
          headers: { X-Serpent-Rid: { $ref: "#/components/headers/XSerpentRid" } }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RequestSummary" }
                  next_cursor: { type: string, nullable: true }

  /api/requests/{id}:
    get:
      tags: [history]
      summary: Request details + step trace + chain snapshot (graph as it was at run time)
      parameters: [ { $ref: "#/components/parameters/RequestId" } ]
      responses:
        "200":
          description: Full request record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/requests/{id}/events:
    get:
      tags: [history]
      summary: Live execution trace of a request (SSE)
      description: |
        Server-Sent Events stream. Wire format: `event: <name>\ndata: <json>\n\nid: <seq>`.
        Server sends a keep-alive ping every 15s and sets `retry: 2000`. Reconnection is supported via
        the `Last-Event-ID` header. If the request already finished, the server immediately replays all
        stored steps and closes the stream with `request_done`.

        Events:
        - `step_started` → SSEStepStarted — a chain node began executing (🟡 in UI)
        - `step_finished` → SSEStepFinished — node completed (🟢 ok / 🔴 fail / ⚪ skip: see `kind` and `status`)
        - `provider_dead` → SSEProviderDead — provider is excluded for the rest of THIS request
        - `merge_progress` → SSEMergeProgress — full-chain live counter (collected/unique links so far)
        - `merge_done` → SSEMergeDone — full-chain terminal merge counters (before `request_done`)
        - `request_done` → SSERequestDone — terminal event; stream closes right after

        The UI maps steps onto the chain snapshot: running node = yellow pulse, ok = green, fail = red,
        skipped = gray; ProgressCube fills with each finished step and turns red on abort.
      parameters: [ { $ref: "#/components/parameters/RequestId" } ]
      responses:
        "200":
          description: SSE stream
          headers:
            Cache-Control: { schema: { type: string }, description: "no-cache" }
            Last-Event-ID:
              schema: { type: string }
              description: Echo of the client's last received event id (request header)
          content:
            text/event-stream:
              schema: { type: string, description: SSE wire format; see operation description for event payloads }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/events:
    get:
      tags: [history]
      summary: Global feed (SSE) — request_created / request_done for Dashboard and History
      description: Server-Sent Events; same wire format as `/api/requests/{id}/events`.
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }

  # ---------------- chains ----------------
  /api/chains:
    get:
      tags: [chains]
      summary: List chains (summaries)
      responses:
        "200":
          description: Chains
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChainSummary" }
    post:
      tags: [chains]
      summary: Create chain (nodes + edges + layout); server validates the graph
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chain" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/chains/{id}:
    get:
      tags: [chains]
      summary: Chain details (graph + layout)
      parameters: [ { $ref: "#/components/parameters/ChainId" } ]
      responses:
        "200":
          description: Chain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chain" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [chains]
      summary: Replace graph (nodes/edges/positions) + metadata; validated before save
      parameters: [ { $ref: "#/components/parameters/ChainId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainInput" }
      responses:
        "200":
          description: Updated (version is incremented)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chain" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [chains]
      summary: Delete chain (the ACTIVE chain cannot be deleted; bound API keys move to the active chain)
      parameters: [ { $ref: "#/components/parameters/ChainId" } ]
      responses:
        "200":
          description: Deleted; `unbound_keys` reports how many API keys were unbound and `moved_to_default` how many active ones moved to the active chain
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  unbound_keys: { type: integer }
                  moved_to_default: { type: integer }
        "409":
          description: The active chain cannot be deleted (`chain_active`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/chains/{id}/activate:
    post:
      tags: [chains]
      summary: Make chain active (exactly one active chain at a time)
      parameters: [ { $ref: "#/components/parameters/ChainId" } ]
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/chains/{id}/duplicate:
    post:
      tags: [chains]
      summary: Duplicate chain ("<name> copy")
      parameters: [ { $ref: "#/components/parameters/ChainId" } ]
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chain" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/chains/validate:
    post:
      tags: [chains]
      summary: Dry-run validation of a draft graph (also used live by the editor canvas)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainInput" }
      responses:
        "200":
          description: Validation result (cycles, orphans, >1 start, dangling edges, bad params)
          content:
            application/json:
              schema:
                type: object
                required: [valid, errors]
                properties:
                  valid: { type: boolean }
                  errors:
                    type: array
                    items: { $ref: "#/components/schemas/ValidationIssue" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ---------------- providers ----------------
  /api/providers/drivers:
    get:
      tags: [providers]
      summary: List the built-in driver catalog (credentials/params schema per driver)
      responses:
        "200":
          description: Driver schemas (one per registered code, regardless of configured instances)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string }
                    name: { type: string }
                    deprecated: { type: boolean }
                    default_base_url: { type: string }
                    credentials:
                      type: array
                      items: { $ref: "#/components/schemas/CredentialMeta" }
                    params:
                      type: array
                      items: { type: object }
                    hints: { type: array, items: { type: string } }

  /api/providers:
    get:
      tags: [providers]
      summary: 'List providers (credentials masked: only `"***"` + set flag)'
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Provider" }
    post:
      tags: [providers]
      summary: Create provider (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/providers/bulk:
    post:
      tags: [providers]
      summary: Bulk enable, disable or delete provider instances (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkInput" }
            description: "`action` is one of `enable`, `disable`, `delete`"
      responses:
        "200":
          description: Bulk result; deletion skips providers referenced by a chain (`provider_in_use`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/providers/{id}:
    get:
      tags: [providers]
      summary: Provider details
      parameters: [ { $ref: "#/components/parameters/ProviderId" } ]
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [providers]
      summary: Full replace of a provider
      parameters: [ { $ref: "#/components/parameters/ProviderId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [providers]
      summary: Partial update — enabled toggle and/or base_url
      description: |
        Used by the card on/off switch (`enabled`) and the URL field (`base_url`).
        `base_url` is **not a secret** (e.g. the external SearXNG URL) and is freely
        readable/editable. Full edits (name/params/credentials) go through `PUT`.
      parameters: [ { $ref: "#/components/parameters/ProviderId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [providers]
      summary: Delete a provider instance (refused while a chain references it)
      parameters: [ { $ref: "#/components/parameters/ProviderId" } ]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "409":
          description: Provider is used by one or more chains (`error.chains[]`); remove it from the chains first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/providers/{id}/test:
    post:
      tags: [providers]
      summary: Live test of a provider (probe query "test"; shows http/kind/ms and up to 3 links)
      parameters: [ { $ref: "#/components/parameters/ProviderId" } ]
      responses:
        "200":
          description: Probe result (a failed probe is HTTP 200 with ok=false — classification is in `kind`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- proxies ----------------
  /api/proxies:
    get:
      tags: [providers]
      summary: List named outbound proxies (password values are never returned)
      responses:
        "200":
          description: Proxies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Proxy" }
    post:
      tags: [providers]
      summary: Create a named proxy (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proxy" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/proxies/{id}:
    parameters: [ { $ref: "#/components/parameters/ProxyId" } ]
    get:
      tags: [providers]
      summary: Proxy details
      responses:
        "200":
          description: Proxy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proxy" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [providers]
      summary: Full replace of a proxy (blank password keeps the stored secret)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxyInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proxy" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [providers]
      summary: Enable or disable a proxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proxy" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [providers]
      summary: Delete a proxy (providers using it fall back to a direct connection)
      responses:
        "200":
          description: "`cleared` is the number of providers switched to a direct connection"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cleared: { type: integer }
                  providers: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- settings ----------------
  /api/settings:
    get:
      tags: [settings]
      summary: All settings (with source env|db|default and readonly flags)
      responses:
        "200":
          description: Settings catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
    put:
      tags: [settings]
      summary: Update settings (db-sourced only; unchanged read-only keys are ignored)
      description: >
        Environment-managed and environment-only values that are echoed back
        unchanged are ignored, so a full-snapshot PUT succeeds; only an actual
        attempt to change a locked value is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdateRequest" }
      responses:
        "200":
          description: Applied (some keys need a container restart — e.g. STORAGE_DRIVER)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsUpdateResponse" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/info:
    get:
      tags: [settings]
      summary: Build and runtime metadata (read scope)
      responses:
        "200":
          description: Version, commit, build date, Go runtime, storage driver and uptime
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: 1.1.1 }
                  commit: { type: string, example: d412056 }
                  build_date: { type: string, example: "2026-10-09T21:35:39Z" }
                  go_version: { type: string, example: go1.26.0 }
                  storage_driver: { type: string, enum: [sqlite, postgres] }
                  started_at: { type: string, format: date-time }
                  uptime_seconds: { type: integer }

  /api/update:
    get:
      tags: [settings]
      summary: Cached update status (read scope; never performs a network request)
      responses:
        "200":
          description: Update status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }

  /api/update/check:
    post:
      tags: [settings]
      summary: Force an immediate release check (admin)
      responses:
        "200":
          description: Update status (may carry `error` when the check failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "400":
          description: Update checks are disabled or no URL is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/settings/storage/test:
    post:
      tags: [settings]
      summary: Test storage connectivity and report the active driver
      responses:
        "200":
          description: Connectivity result
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver: { type: string }
                  ok: { type: boolean }
                  error: { type: string }
                  restart_required_for_switch: { type: boolean }

  # ---------------- logs ----------------
  /api/logs:
    get:
      tags: [logs]
      summary: Browse in-app logs (secrets are already redacted server-side)
      parameters:
        - name: level
          in: query
          schema: { $ref: "#/components/schemas/LogLevel" }
        - name: q
          in: query
          schema: { type: string, description: Substring match on message }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of log entries (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
                  next_cursor: { type: string, nullable: true }

  # ---------------- audit ----------------
  /api/audit:
    get:
      tags: [audit]
      summary: Administrative audit trail (admin)
      parameters:
        - name: action
          in: query
          schema: { type: string }
          description: Exact action name, e.g. `chain.update`
        - name: actor
          in: query
          schema: { type: string }
          description: Match the actor's user name or id
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          schema: { type: string }
          description: Substring match over action, target, user name and details
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Page of audit records (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }

  # ---------------- config ----------------
  /api/config/export:
    get:
      tags: [settings]
      summary: Export configuration (admin) — providers, chains and non-secret settings
      description: Credentials and proxy passwords are never included; re-enter them after an import.
      responses:
        "200":
          description: Configuration bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigBundle" }

  /api/config/import:
    post:
      tags: [settings]
      summary: Import configuration (admin)
      parameters:
        - name: overwrite
          in: query
          schema: { type: boolean, default: false }
          description: Update existing providers/chains matched by name instead of skipping them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigBundle" }
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers_created: { type: integer }
                  providers_updated: { type: integer }
                  chains_created: { type: integer }
                  chains_updated: { type: integer }
                  chains_skipped: { type: integer }
                  settings_applied: { type: integer }

  # ---------------- maintenance ----------------
  /api/maintenance/status:
    get:
      tags: [maintenance]
      summary: Background job status (last run, last error)
      responses:
        "200":
          description: Job status keyed by job name
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        last_run: { type: string, nullable: true }
                        last_error: { type: string, nullable: true }

  /api/maintenance/clear-logs:
    post:
      tags: [maintenance]
      summary: "UI button: delete ALL log rows"
      responses:
        "200":
          description: Deleted count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedResponse" }

  /api/maintenance/clear-history:
    post:
      tags: [maintenance]
      summary: "UI button: delete request history (optionally only older than N days)"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                older_than_days:
                  type: integer
                  minimum: 1
                  description: Omitted = delete everything
      responses:
        "200":
          description: Deleted counts (steps are removed via cascade)
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests_deleted: { type: integer }
                  steps_deleted: { type: integer }

  /api/maintenance/vacuum-now:
    post:
      tags: [maintenance]
      summary: Run VACUUM immediately (SQLite driver only; no-op on PostgreSQL)
      responses:
        "200":
          description: Vacuum result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  freed_bytes: { type: integer, format: int64 }

  /api/maintenance/run-cleanup:
    post:
      tags: [maintenance]
      summary: Run the retention cleanup job NOW (history/logs/sessions by *_RETENTION_DAYS)
      responses:
        "200":
          description: Cleanup summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupResponse" }

  # ---------------- stats ----------------
  /api/stats/summary:
    get:
      tags: [stats]
      summary: Dashboard aggregates (today counters, 7-day sparkline, provider health)
      responses:
        "200":
          description: Stats bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsResponse" }

  /api/stats/analytics:
    get:
      tags: [stats]
      summary: Request analytics for a date range (daily series, hourly distribution, providers)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: Inclusive start date (UTC). Defaults to the first day of the current month. }
        - { name: to, in: query, schema: { type: string, format: date }, description: Inclusive end date (UTC). Defaults to today. }
        - { name: provider, in: query, schema: { type: string }, description: Only include requests that attempted this provider (successful, failed or skipped), matched via executed steps. }
        - { name: status, in: query, schema: { type: string, enum: [ok, empty, fail, running] }, description: Only count requests with this final status. }
        - name: user_id
          in: query
          required: false
          schema: { type: string }
          description: >
            Narrow the report to one owner: a user id, or the literal `anonymous`
            for requests made without a user (auth disabled or an anonymous
            caller). Omitted = all owners. Non-admin callers may only pass their
            own user id (403 otherwise).
      responses:
        "200":
          description: Analytics bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/stats/users:
    get:
      tags: [stats]
      summary: Per-user analytics leaderboard for a date range (administrators only)
      description: >
        Request aggregates for every owner (users plus the `anonymous` bucket),
        merged with account data, active key counts and the runtime quota
        status. Users without traffic in the period are returned zero-filled.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: Inclusive start date (UTC). Defaults to the first day of the current month. }
        - { name: to, in: query, schema: { type: string, format: date }, description: Inclusive end date (UTC). Defaults to today. }
      responses:
        "200":
          description: Leaderboard bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsersAnalyticsResponse" }

  # ---------------- playground ----------------
  /api/search/ui:
    post:
      tags: [playground]
      summary: Start a manual search from the UI (async — trace it live over SSE)
      description: Creates the request and returns immediately; the UI subscribes to `/api/requests/{id}/events`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "202":
          description: Accepted — follow the trace at `stream_url`
          headers: { X-Serpent-Rid: { $ref: "#/components/headers/XSerpentRid" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaygroundResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API key in `Authorization: Bearer …`. Scopes: `search` → `/search` only; `read` → GET `/api/*`;
        `admin` → everything. Key format `seek_ak_<prefix>.<secret>` / `seek_admin_…`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: seek_sid
      description: Session cookie (HttpOnly, Secure, SameSite=Strict, rolling expiry 30d).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token (readable cookie `seek_csrf` → echo in this header) — required on all mutations made with cookieAuth.

  headers:
    XSerpentRid:
      description: Request codifier `NNNN-xxxx`; links responses, logs and History records
      schema: { type: string, example: "0008-1c77" }
    XSerpentApi:
      description: Provider that produced the final answer (last executed provider otherwise), `-` when none
      schema: { type: string, example: "searxng" }

  parameters:
    UserId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    KeyId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RequestId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ChainId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ProviderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: Provider *instance* id (providers.id), not the driver code
        example: 3f9c2b1a-1c2d-4e5f-8a9b-0c1d2e3f4a5b
    ProxyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: Named proxy id (proxies.id)
        example: 7a1b2c3d-4e5f-6789-abcd-ef0123456789
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, description: Opaque cursor from next_cursor (absent on first page) }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: bad_json, message: "request body is not valid JSON", rid: "0008-1c77" } }
    Unauthorized:
      description: Missing/invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: unauthorized, message: "invalid or missing credentials", rid: "0008-1c77" } }
    NotFound:
      description: Entity not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: not_found, message: "entity not found", rid: "0008-1c77" } }
    Forbidden:
      description: Insufficient permissions (e.g. a non-admin reading another owner's data)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: forbidden, message: "admin scope required", rid: "0008-1c77" } }
    Conflict:
      description: State conflict (unique violation, rule violation, etc.)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: conflict, message: "name already exists", rid: "0008-1c77" } }
    ValidationFailed:
      description: Domain validation failed (e.g. chain graph errors)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { $ref: "#/components/schemas/ErrorObject" }
              issues:
                type: array
                items: { $ref: "#/components/schemas/ValidationIssue" }
          example:
            error: { code: validation_failed, message: "chain graph is invalid", rid: "0008-1c77" }
            issues:
              - node_key: blk-2
                field: provider
                message: "unknown provider node"
    RateLimited:
      description: |
        Too many requests. Auth endpoints allow 10 attempts/min per IP. `/search`, `/mcp` and the
        playground enforce the optional `SEARCH_RATE_LIMIT_PER_MINUTE` (code `rate_limited`) and
        `SEARCH_DAILY_QUOTA` (code `quota_exceeded`); a `Retry-After` header and, on success,
        `X-Serpent-Quota-Remaining` are returned where applicable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: rate_limited, message: "search rate limit exceeded", rid: "0008-1c77" } }

  schemas:
    # ---------- shared ----------
    Row:
      type: object
      required: [link, title, snippet]
      properties:
        link: { type: string, description: Result URL }
        title: { type: string }
        snippet: { type: string }
        sources:
          type: array
          items: { type: string }
          description: >
            Only in the history/dedupe view (full-chain mode): providers whose responses
            contained this link after dedupe ("found at N providers"). Never returned by /search.
      description: Open WebUI result row (normalized from any provider)

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1 }
        count:
          type: integer
          minimum: 0
          maximum: 20
          default: 0
          description: >
            Result cap. 0 (or omitted) = return everything found — providers are
            queried without a num/pageSize limit and the response is not truncated.
            The global setting IGNORE_REQUEST_COUNT ("Settings → Network & engine") forces this
            behaviour for every request.

    ErrorObject:
      type: object
      required: [code, message, rid]
      properties:
        code: { type: string }
        message: { type: string, description: Secrets are redacted server-side }
        rid: { type: string, example: "0008-1c77" }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorObject" }

    BulkInput:
      type: object
      required: [action, ids]
      properties:
        action: { type: string, description: "keys: revoke|delete; providers: enable|disable|delete" }
        ids:
          type: array
          maxItems: 500
          items: { type: string }

    BulkResult:
      type: object
      required: [updated, requested, skipped]
      properties:
        updated: { type: integer }
        requested: { type: integer }
        skipped:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              reason: { type: string, example: provider_in_use }

    # ---------- enums ----------
    RequestStatus:
      type: string
      enum: [running, ok, empty, fail]
      description: "`empty` only if the LAST executed step was a 2xx with zero links; otherwise `fail`"

    StepStatus:
      type: string
      enum: [running, ok, fail, skipped]
      description: "UI colors: running 🟡, ok 🟢, fail 🔴, skipped ⚪"

    StepKind:
      type: string
      enum: [ok, empty, api, http, net, timeout, read, json, skip]
      description: Classification of an execution step (permanent kinds exclude the provider for the request)

    LogLevel:
      type: string
      enum: [DEBUG, INFO, WARN, ERROR, OK]

    DelayPolicy:
      type: string
      enum: [none, fixed, linear]

    # ---------- history ----------
    RequestSummary:
      type: object
      required: [id, rid, query, count, status, created_at]
      properties:
        id: { type: string, format: uuid }
        rid: { type: string, example: "0008-1c77" }
        query: { type: string }
        count: { type: integer }
        status: { $ref: "#/components/schemas/RequestStatus" }
        used_provider: { type: string, nullable: true }
        results_count: { type: integer }
        total_ms: { type: integer, format: int64 }
        steps_count: { type: integer }
        chain_id: { type: string, format: uuid, nullable: true }
        client: { type: string, nullable: true, description: "open-webui | ui | key name" }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    RequestStep:
      type: object
      required: [idx, provider, attempt_no, status]
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        idx: { type: integer, description: Step number inside the request (0-based) }
        node_key: { type: string, nullable: true, description: Chain node that produced the step }
        provider: { type: string }
        engine: { type: string, nullable: true }
        attempt_no: { type: integer, minimum: 1 }
        stage: { type: string, nullable: true, description: "Sub-call of a multi-call node (pubmed esearch|esummary|efetch)" }
        status: { $ref: "#/components/schemas/StepStatus" }
        kind: { $ref: "#/components/schemas/StepKind" }
        http_status: { type: integer, nullable: true }
        error: { type: string, nullable: true, description: Redacted server-side }
        permanent: { type: boolean, description: Provider excluded for the rest of THIS request }
        results_count: { type: integer }
        wait_before_ms: { type: integer, format: int64, description: Backoff applied before the call }
        took_ms: { type: integer, format: int64 }
        cost: { type: number, description: "Snapshot of the provider's configured cost_per_request at execution time (0/absent = not counted)" }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    RequestDetail:
      allOf:
        - $ref: "#/components/schemas/RequestSummary"
        - type: object
          properties:
            steps:
              type: array
              items: { $ref: "#/components/schemas/RequestStep" }
            chain_snapshot:
              $ref: "#/components/schemas/Chain"
              description: Exact graph the request ran on, including its mode (colored by step results in the UI)
            answer:
              type: string
              nullable: true
              description: Generated text of the last answer-mode node (absent for search-only chains)
            merge:
              type: object
              nullable: true
              description: Full-chain merge summary (present for full_chain requests)
              properties:
                collected_total: { type: integer }
                unique_links: { type: integer }
                duplicates_removed: { type: integer }
            results:
              type: array
              description: Persisted final rows (with `sources` in full-chain mode)
              items: { $ref: "#/components/schemas/Row" }

    # ---------- chains ----------
    ChainNode:
      type: object
      required: [key]
      properties:
        key: { type: string, description: Node id unique within the chain }
        kind:
          type: string
          enum: [provider, start, join]
          default: provider
          description: >
            provider — runs a provider instance; start — logical entry point (no
            provider, may fan out to several branches); join — logical merge
            block that waits for its branches and removes duplicate URLs. Exactly
            one start block is required. Logical blocks ignore provider_id/mode.
        provider_id: { type: string, description: Provider instance id (providers.id); required for kind=provider }
        label: { type: string, nullable: true }
        mode:
          type: string
          enum: [search, answer]
          default: search
          description: >
            search — Row source; answer — generative node whose text goes to the request
            answer field. Answer nodes never join the Row merge and cannot be logical/start blocks.
        params:
          type: object
          additionalProperties: { type: string }
          description: Per-node parameter overrides (engine, hl/gl, language, …)
        timeout_ms: { type: integer, minimum: 1000, maximum: 120000, default: 20000, description: Response wait time per attempt, 1–120s }
        retries: { type: integer, minimum: 0, maximum: 10, default: 0, description: Extra attempts inside the block (linear backoff retry_delay_ms × attempt) }
        retry_delay_ms: { type: integer, minimum: 0, maximum: 30000, default: 700 }
        delay_policy: { $ref: "#/components/schemas/DelayPolicy", default: linear }
        on_success:
          type: string
          default: stop
          description: >
            `stop`, `next` or `edge` — stop ends the chain on success, the others merge the
            rows and keep walking (first_success mode only). Chains saved before the logical
            Start block existed keep the old behaviour and always stop on success.
        on_empty:
          type: string
          default: next
          description: "`next`, `stop` or `edge` — 2xx with zero rows is NOT a success"
        on_fail:
          type: string
          default: next
          description: "`next`, `stop` or `edge`"
        is_start:
          type: boolean
          default: false
          description: Legacy start flag superseded by kind=start; the editor migrates it to an explicit Start block
        pos_x: { type: number, default: 0, description: Editor layout }
        pos_y: { type: number, default: 0 }

    ChainEdge:
      type: object
      required: [from_key, to_key]
      properties:
        from_key: { type: string }
        to_key: { type: string }
        condition:
          type: string
          enum: [success, empty, fail, next, any]
          default: next
          description: >
            Outcome this edge carries (success = green, empty = amber, fail = red, next = neutral).
            In full_chain mode only next/any edges steer the walk; the rest stay as diagnostics.

    ChainGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ChainNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/ChainEdge" }

    ChainMode:
      type: string
      enum: [first_success, full_chain]
      default: first_success
      description: >
        first_success — the first block with a usable result stops the chain;
        full_chain — walk every block reachable from the start along next edges and merge
        all collected links (deduped by normalized URL: lowercase scheme/host, no www.,
        no trailing slash, no fragment, no utm_*/tracking params).

    ChainInput:
      allOf:
        - $ref: "#/components/schemas/ChainGraph"
        - type: object
          properties:
            name: { type: string, minLength: 1 }
            mode: { $ref: "#/components/schemas/ChainMode" }

    Chain:
      type: object
      required: [id, name, active, mode, version, nodes, edges, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean, description: Exactly one chain is active at a time }
        mode: { $ref: "#/components/schemas/ChainMode" }
        version: { type: integer }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ChainNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/ChainEdge" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        bound_keys: { type: integer, description: Number of API keys bound to this chain (computed) }
        active_bound_keys: { type: integer, description: Number of bound API keys that are still active/not revoked; these move to the default chain if the chain is deleted (computed) }

    ChainSummary:
      type: object
      required: [id, name, active, mode, version, updated_at, nodes_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        mode: { $ref: "#/components/schemas/ChainMode" }
        version: { type: integer }
        nodes_count: { type: integer }
        updated_at: { type: string, format: date-time }
        bound_keys: { type: integer, description: Number of API keys bound to this chain (computed) }
        active_bound_keys: { type: integer, description: Number of bound API keys that are still active/not revoked (computed) }

    ValidationIssue:
      type: object
      properties:
        node_key: { type: string, nullable: true }
        field: { type: string, nullable: true }
        message: { type: string, example: "cycle detected: blk-2 -> blk-4 -> blk-2" }

    # ---------- providers ----------
    CredentialMeta:
      type: object
      description: Masked view of a stored credential (secret value is never returned)
      properties:
        name: { type: string, example: api_key }
        set: { type: boolean }
        masked: { type: string, example: "***" }

    Provider:
      type: object
      required: [id, code, name, enabled]
      description: |
        A provider *instance*. Several instances may share the same `code`
        (driver type) with different `name` and credentials.
      properties:
        id: { type: string, description: Instance id referenced by chain nodes }
        code: { type: string, example: searxng, description: Driver type from the provider registry }
        name: { type: string, example: "searxng work", description: User-defined unique instance name }
        enabled: { type: boolean }
        proxy_id:
          type: string
          nullable: true
          description: Optional named proxy (proxies.id) this instance routes through; empty = direct
        base_url:
          type: string
          nullable: true
          description: "Plain editable URL (NOT a secret); may contain a {query} template (searxng)"
        credentials_set:
          type: object
          additionalProperties: { type: boolean }
          description: Which write-only credentials are currently set (values are never returned)
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Driver-specific parameters. The reserved key `cost_per_request` (a positive
            decimal, in any unit) declares the estimated cost of one call; leave it unset
            or non-positive to exclude the provider from cost analytics.
        updated_at: { type: string, format: date-time }

    ProviderInput:
      type: object
      description: |
        Create (`POST`, `code` required) or full update (`PUT`). `code` is the driver
        type from the registry; `name` must be unique across instances.
      properties:
        code: { type: string, pattern: "^[a-z0-9_]+$", description: Required on create only }
        name: { type: string, description: Unique instance name }
        enabled: { type: boolean, default: true }
        proxy_id: { type: string, nullable: true, description: Optional proxies.id to route this instance through }
        base_url: { type: string, nullable: true }
        credentials:
          type: object
          additionalProperties: { type: string }
          description: Secret values to store (write-only on input too)
        params:
          type: object
          additionalProperties: { type: string }

    ProviderPatch:
      type: object
      description: Lightweight update used by the card toggle (enabled) and the URL field.
      properties:
        enabled: { type: boolean, description: Toggle the provider instance on/off }
        base_url: { type: string, nullable: true }

    Proxy:
      type: object
      required: [id, name, enabled, type, host]
      description: A named outbound proxy selectable per provider (password is write-only).
      properties:
        id: { type: string }
        name: { type: string, description: Unique display name }
        enabled: { type: boolean, description: Disabled proxies are kept but not used }
        type: { type: string, enum: [http, https, socks5] }
        host: { type: string, example: proxy.example.com }
        port: { type: string, nullable: true, example: "1080" }
        username: { type: string, nullable: true }
        password_set: { type: boolean, description: Whether a password is stored (value is never returned) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProxyInput:
      type: object
      description: Create or replace a named proxy. A blank password on update keeps the stored secret.
      required: [name, host]
      properties:
        name: { type: string }
        enabled: { type: boolean, default: true }
        type: { type: string, enum: [http, https, socks5], default: http }
        host: { type: string }
        port: { type: string, nullable: true }
        username: { type: string, nullable: true }
        password: { type: string, description: Write-only; omit or leave blank to keep the existing secret }

    ProviderTestResult:
      type: object
      required: [ok, kind]
      properties:
        ok: { type: boolean }
        kind: { $ref: "#/components/schemas/StepKind" }
        http: { type: integer, nullable: true }
        engine: { type: string, nullable: true }
        took_ms: { type: integer, format: int64 }
        error: { type: string, nullable: true, description: Redacted }
        results:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Row" }
        answer: { type: string, nullable: true, description: Generated answer text (answer-type drivers) }

    # ---------- settings ----------
    SettingSource:
      type: string
      enum: [env, db, default]

    SettingItem:
      type: object
      required: [key, value, source, readonly]
      properties:
        key: { type: string, example: HISTORY_RETENTION_DAYS }
        value: { type: string, nullable: true, description: Secrets are delivered masked }
        source: { $ref: "#/components/schemas/SettingSource" }
        readonly: { type: boolean, description: true when managed by env }
        description: { type: string, nullable: true }

    SettingsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SettingItem" }

    SettingsUpdateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: object
          additionalProperties: { type: string }
          description: key → new value (db-managed keys only)

    SettingsUpdateResponse:
      type: object
      properties:
        applied:
          type: array
          items: { type: string }
        restart_required:
          type: array
          items: { type: string }
          description: Keys that take effect only after container restart (e.g. STORAGE_DRIVER)

    # ---------- logs ----------
    LogEntry:
      type: object
      required: [id, ts, level, message]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        level: { $ref: "#/components/schemas/LogLevel" }
        rid: { type: string, nullable: true }
        api: { type: string, nullable: true, description: 'Provider tag from [rid|api]' }
        message: { type: string, description: Already redacted server-side }

    AuditEntry:
      type: object
      required: [id, ts, action]
      properties:
        id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        user_id: { type: string, description: Actor user id (empty in open-admin mode) }
        user: { type: string, description: Actor user name }
        via: { type: string, enum: [key, session, disabled] }
        ip: { type: string }
        action: { type: string, example: chain.update }
        target: { type: string, description: Entity id or setting key }
        details:
          type: object
          additionalProperties: { type: string }
          description: Small non-secret context (names, counts, changed setting keys)

    ConfigBundle:
      type: object
      required: [version, providers, chains]
      description: Portable, secret-free configuration snapshot (providers, chains, non-secret settings).
      properties:
        version: { type: integer }
        exported_at: { type: string, format: date-time }
        providers:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: Source instance id, used to remap chain nodes on import }
              code: { type: string }
              name: { type: string }
              enabled: { type: boolean }
              base_url: { type: string }
              params: { type: object, additionalProperties: { type: string } }
        chains:
          type: array
          items: { $ref: "#/components/schemas/Chain" }
        settings:
          type: object
          additionalProperties: { type: string }

    UpdateStatus:
      type: object
      properties:
        enabled: { type: boolean, description: false when UPDATE_CHECK_ENABLED is off }
        current: { type: string, example: 1.1.0 }
        latest: { type: string, nullable: true, example: 1.2.0 }
        update_available: { type: boolean }
        url: { type: string, nullable: true, description: Release notes URL }
        name: { type: string, nullable: true }
        published_at: { type: string, nullable: true }
        prerelease: { type: boolean }
        checked_at: { type: string, nullable: true }
        error: { type: string, nullable: true, description: Non-fatal reason the last check failed }

    # ---------- maintenance / stats ----------
    DeletedResponse:
      type: object
      properties: { deleted: { type: integer, format: int64 } }

    CleanupResponse:
      type: object
      properties:
        requests_deleted: { type: integer, format: int64 }
        logs_deleted: { type: integer, format: int64 }
        sessions_deleted: { type: integer, format: int64 }
        took_ms: { type: integer, format: int64 }

    StatsResponse:
      type: object
      properties:
        summary: { $ref: "#/components/schemas/StatsSummary" }
        providers:
          type: array
          items: { $ref: "#/components/schemas/Provider" }
        jobs: { type: object, additionalProperties: true }

    StatsSummary:
      type: object
      properties:
        requests_today: { type: integer }
        success_rate: { type: number, example: 92.5, description: Share of `ok` requests today, in percent }
        avg_ms: { type: integer }
        errors_today: { type: integer }
        total_requests: { type: integer }
        daily:
          type: array
          maxItems: 7
          items: { $ref: "#/components/schemas/DailyStat" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/RequestSummary" }

    AnalyticsResponse:
      type: object
      properties:
        range:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        report: { $ref: "#/components/schemas/AnalyticsReport" }
        providers:
          type: array
          description: Per-provider outcomes over the selected period (unaffected by provider/status filters).
          items:
            type: object
            properties:
              provider: { type: string }
              code: { type: string }
              enabled: { type: boolean }
              configured: { type: boolean }
              total: { type: integer }
              ok: { type: integer }
              empty: { type: integer }
              fail: { type: integer }
              skip: { type: integer }
              avg_ms: { type: integer }
              success_rate: { type: number, example: 92.5 }
              cost: { type: number, description: Summed cost of the provider's executed attempts }
              cost_configured: { type: boolean, description: false = no cost configured, so the UI shows a dash instead of 0 }

    AnalyticsReport:
      type: object
      properties:
        total_requests: { type: integer }
        ok: { type: integer }
        empty: { type: integer }
        fail: { type: integer }
        success_rate: { type: number }
        avg_ms: { type: integer }
        p95_ms: { type: integer }
        active_days: { type: integer }
        busiest_date: { type: string, format: date }
        busiest_count: { type: integer }
        cost_total: { type: number, description: Estimated cost of executed attempts in the range (absent when no provider has a cost configured) }
        cost_configured: { type: boolean, description: Whether any provider declares a cost; the UI hides the cost column otherwise }
        daily:
          type: array
          items: { $ref: "#/components/schemas/DailyStat" }
        hourly:
          type: array
          items:
            type: object
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              requests: { type: integer }
              ok: { type: integer }
              empty: { type: integer }
              fail: { type: integer }
        top_queries:
          type: array
          items:
            type: object
            properties:
              query: { type: string }
              count: { type: integer }
              ok: { type: integer }
              fail: { type: integer }

    DailyStat:
      type: object
      properties:
        date: { type: string, format: date }
        requests: { type: integer }
        ok: { type: integer }
        empty: { type: integer }
        fail: { type: integer }
        avg_ms: { type: integer }

    UsersAnalyticsResponse:
      type: object
      properties:
        range:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        rows:
          type: array
          items: { $ref: "#/components/schemas/UserStatRow" }
        totals:
          type: object
          properties:
            requests: { type: integer }
            ok: { type: integer }
            empty: { type: integer }
            fail: { type: integer }
            active_users: { type: integer, description: Owners with at least one request in the period (anonymous excluded) }
            cost: { type: number, description: Summed cost of executed attempts across all owners }
            cost_configured: { type: boolean, description: false = no cost configured, so the UI shows a dash instead of 0 }

    UserStatRow:
      type: object
      properties:
        user_id:
          type: string
          description: User id, or the literal `anonymous` for requests made without a user
        name: { type: string, description: Account name (empty for the anonymous bucket and deleted users) }
        role: { type: string, enum: [admin, viewer] }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        exists: { type: boolean, description: false = the user account was deleted but its traffic remains in history }
        requests: { type: integer }
        ok: { type: integer }
        empty: { type: integer }
        fail: { type: integer }
        avg_ms: { type: integer }
        last_active: { type: string, format: date-time, description: Latest request timestamp in the period (absent when no traffic) }
        cost: { type: number, description: Summed cost of the owner's executed attempts (absent when 0) }
        keys_count: { type: integer, description: Active (non-revoked) API keys owned by the user }
        quota:
          $ref: "#/components/schemas/UserQuotaStatus"
          description: Runtime per-user quota view; absent when the user is unlimited.

    # ---------- auth ----------
    User:
      type: object
      required: [id, name, role, disabled, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [admin, viewer] }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        quota:
          $ref: "#/components/schemas/UserQuotaStatus"
          description: Runtime per-user quota view; absent when the user is unlimited.

    QuotaPeriod:
      type: string
      enum: [daily, weekly, monthly, rolling]
      description: >
        daily resets at midnight (shifted by tz_offset), weekly on Monday 00:00,
        monthly on the 1st of the month 00:00, rolling is a sliding window of
        window_hours.

    UserQuotaInput:
      type: object
      properties:
        requests:
          type: integer
          minimum: 0
          description: Max search requests per period; 0 = unlimited.
        period: { $ref: "#/components/schemas/QuotaPeriod" }
        window_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 24
          description: Sliding-window length; only used when period = rolling.
        tz_offset:
          type: integer
          minimum: -720
          maximum: 840
          default: 0
          description: Fixed offset in minutes applied to calendar reset boundaries (0 = UTC).

    UserQuotaStatus:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        requests: { type: integer, description: 0 = unlimited }
        period: { $ref: "#/components/schemas/QuotaPeriod" }
        window_hours: { type: integer }
        tz_offset: { type: integer }
        used: { type: integer, description: Requests counted in the current period }
        remaining: { type: integer }
        reset_at:
          type: string
          format: date-time
          description: RFC3339 UTC moment the current period ends; absent for rolling quotas.
        updated_at: { type: string, format: date-time }

    UserInput:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, enum: [admin, viewer], default: viewer }

    UserPatch:
      type: object
      properties:
        name: { type: string }
        role: { type: string, enum: [admin, viewer] }
        disabled: { type: boolean }

    ApiKeyScope:
      type: string
      enum: [search, read, admin]

    ApiKey:
      type: object
      required: [id, user_id, name, prefix, scopes, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: Identifiable prefix only, e.g. seek_ak_ab12cd34 }
        scopes:
          type: string
          description: Comma-separated granted scopes, e.g. "admin,search,read"
          example: "search"
        chain_id:
          type: string
          nullable: true
          description: Chain bound to this token; null/empty means the active chain. Cleared when the chain is deleted.
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        used_today:
          type: integer
          description: Search requests made with this key today (UTC). Computed by the server; not stored with the key.
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ApiKeyCreateInput:
      type: object
      required: [user_id, name]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        scope: { $ref: "#/components/schemas/ApiKeyScope", default: search }
        chain_id: { type: string, nullable: true, description: Optional chain to bind; omit/empty for the active chain }

    ApiKeyCreated:
      type: object
      required: [key, plaintext]
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        plaintext:
          type: string
          description: Full key material — returned ONCE at creation, never stored or shown again
          example: "seek_ak_ab12cd34.8f3a1c9d7b2e4a5f6c0d1e2b3a4c5d6e7f"

    DeveloperToken:
      type: object
      required: [id, name, prefix, created_at, permissions, all_endpoints]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: Identifiable prefix only, e.g. seek_dev_ab12cd }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        permissions:
          type: array
          items: { type: string, example: "GET /api/chains" }
          description: Granted endpoint ids; empty when all_endpoints is true.
        all_endpoints:
          type: boolean
          description: True when the token may call every endpoint (no restriction).

    DeveloperEndpoint:
      type: object
      required: [id, method, path]
      properties:
        id: { type: string, description: "Endpoint id usable in permissions", example: "GET /api/chains" }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE] }
        path: { type: string, example: "/api/chains/{id}" }
        tag: { type: string, description: OpenAPI tag used to group the endpoint in the UI }
        summary: { type: string }
        public: { type: boolean, description: "Always false here — public endpoints need no permission" }

    DeveloperTokenPatch:
      type: object
      properties:
        name: { type: string }
        permissions:
          type: array
          description: Full replacement permission list; `["*"]` restores full access, `[]` denies everything.
          items: { type: string, example: "POST /api/chains" }

    DeveloperStatus:
      type: object
      required: [enabled, env_locked, tokens]
      properties:
        enabled: { type: boolean, description: Whether developer mode is currently on }
        env_locked: { type: boolean, description: True when DEVELOPER_MODE is pinned by an environment variable (read-only) }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/DeveloperToken" }

    DeveloperTokenCreated:
      type: object
      required: [token, plaintext]
      properties:
        token: { $ref: "#/components/schemas/DeveloperToken" }
        plaintext:
          type: string
          description: Full developer token — returned ONCE at creation, never stored or shown again
          example: "seek_dev_ab12cd.8f3a1c9d7b2e4a5f6c0d1e2b3a4c5d6e7f"

    PasskeyCredential:
      type: object
      required: [id, user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        sign_count: { type: integer }

    MeResponse:
      type: object
      properties:
        via: { type: string, enum: [key, session, disabled], description: How the caller authenticated }
        scopes:
          type: object
          additionalProperties: { type: boolean }
          description: Granted scopes keyed by name (admin/read/search)
        admin: { type: boolean }
        developer: { type: boolean, description: True when the caller authenticated with a seek_dev_… token }
        developer_mode:
          type: boolean
          description: Whether the instance-level developer mode is enabled (drives the Developer sidebar entry)
        passkeys_enabled:
          type: boolean
          description: false when PUBLIC_ORIGIN is http:// or an IP (WebAuthn requires HTTPS + domain)
        user: { $ref: "#/components/schemas/User" }

    # ---------- playground / sse payloads ----------
    PlaygroundResponse:
      type: object
      required: [request_id, rid, stream_url]
      properties:
        request_id: { type: string, format: uuid }
        rid: { type: string, example: "0008-1c77" }
        stream_url: { type: string, example: "/api/requests/6f2f…/events" }

    SSEStepStarted:
      type: object
      description: Payload of event `step_started`
      properties:
        idx: { type: integer }
        node: { type: string }
        provider: { type: string }
        engine: { type: string, nullable: true }
        t0: { type: string, format: date-time }

    SSEStepFinished:
      type: object
      description: Payload of event `step_finished`
      properties:
        idx: { type: integer }
        node: { type: string }
        provider: { type: string }
        engine: { type: string, nullable: true }
        http: { type: integer, nullable: true }
        kind: { $ref: "#/components/schemas/StepKind" }
        results: { type: integer }
        took_ms: { type: integer, format: int64 }
        wait_before_ms: { type: integer, format: int64 }
        permanent: { type: boolean }
        error: { type: string, nullable: true }

    SSEProviderDead:
      type: object
      description: Payload of event `provider_dead`
      properties:
        provider: { type: string }
        reason: { type: string }

    SSEMergeProgress:
      type: object
      description: Payload of event `merge_progress` (full-chain mode, live counter)
      properties:
        collected: { type: integer, description: Rows fed into the merger so far (incl. duplicates) }
        unique: { type: integer, description: Distinct normalized links so far }

    SSEMergeDone:
      type: object
      description: Payload of event `merge_done` (full-chain mode, terminal merge counters)
      properties:
        collected_total: { type: integer }
        unique_links: { type: integer }
        duplicates_removed: { type: integer }

    SSERequestDone:
      type: object
      description: Payload of event `request_done` — terminal, stream closes after it
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/RequestStatus" }
        used: { type: string, nullable: true }
        steps: { type: integer }
        total_ms: { type: integer, format: int64 }
        results: { type: integer }
        error: { type: string, nullable: true }
        collected_total: { type: integer, description: Full-chain mode only }
        unique_links: { type: integer, description: Full-chain mode only }
        duplicates_removed: { type: integer, description: Full-chain mode only }

    SSERequestCreated:
      type: object
      description: Payload of event `request_created` (global feed)
      properties:
        request: { $ref: "#/components/schemas/RequestSummary" }
