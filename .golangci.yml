version: "2"

run:
  tests: true

linters:
  # Default (standard) set: errcheck, govet, ineffassign, staticcheck, unused.
  # contextcheck is deliberately NOT enabled: it flags every logger call that
  # does not thread a context through the logging package, which is by design
  # (see internal/logging). Enabling it produces ~30 false positives.
  enable:
    - bodyclose
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may build requests without a context.
      - linters: [noctx]
        path: _test\.go
      # Unchecked errors are common in test setup.
      - linters: [errcheck]
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/liberide/serpent-seek
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
