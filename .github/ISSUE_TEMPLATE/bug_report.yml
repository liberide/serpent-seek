name: Bug report
description: Report a reproducible problem with SerpentSeek
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing
        issues first. For security vulnerabilities use the private channel
        described in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `curl -s http://localhost:8080/version`, the Docker image tag, or the git commit.
      placeholder: "1.1.0 / sallend/serpent-seek:latest / d412056"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose (SQLite)
        - Docker Compose (PostgreSQL, extdb profile)
        - Prebuilt Docker image
        - Local `go run` / `make dev`
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure provider …
        2. Create a chain with …
        3. POST /search with …
        4. See …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / request id
      description: Include the `X-Serpent-Rid` header value when the problem is search-related. Redact secrets.
      render: shell
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
    validations:
      required: false
