name: Feature request
description: Suggest an idea or a new search provider / integration
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Which workflow is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change. For a new provider driver, link the upstream API docs and note the license.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Search provider driver
        - label: Chain editor / engine
        - label: API / OpenAPI
        - label: Web UI
        - label: Deployment / storage
        - label: Documentation
