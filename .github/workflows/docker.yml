name: Docker

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Docker Hub repository. Defaults to <DockerHub-user>/serpent-seek.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/serpent-seek
      # Publish to Docker Hub strictly on version tag pushes (v*).
      # Pull requests and manual runs build only, never push.
      PUSH_IMAGE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute build date
        id: builddate
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: appver
        run: |
          # On a version tag (v*), derive the version from the tag so the
          # binary, the Docker tags and the UI all report the same value.
          # Otherwise fall back to the version declared in version.go.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' internal/version/version.go | head -1)
          fi
          echo "value=${v:-1.1.2}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.appver.outputs.value }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAG=${{ steps.appver.outputs.value }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.builddate.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Vulnerability scan + SBOM of the built image. Runs on the same triggers,
  # independent of the publish job.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image for scanning
        run: docker build -t serpentseek:scan .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: serpentseek:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: serpentseek:scan
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: serpentseek-sbom
          # Keep least privilege: publish the SBOM as a workflow artifact only.
          upload-release-assets: false
